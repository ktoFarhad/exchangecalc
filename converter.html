<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExchangeCalc - Калькулятор валют</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">
                <i class="fas fa-exchange-alt"></i>
                <h1>ExchangeCalc</h1>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Главная</a></li>
                <li><a href="converter.html" class="active">Калькулятор</a></li>
                <li><a href="rates.html">Курсы валют</a></li>
                <li><a href="about.html">О нас</a></li>
                <li><a href="contact.html">Контакты</a></li>
            </ul>
            <div class="burger">
                <div class="line1"></div>
                <div class="line2"></div>
                <div class="line3"></div>
            </div>
        </nav>
    </header>

    <main class="container">
        <section class="converter-section">
            <h2>Калькулятор <span class="highlight">валют</span></h2>
            <p>Конвертируйте между различными валютами, используя актуальные обменные курсы</p>
            
            <div class="converter-container">
                <div class="converter-form">
                    <div class="form-group">
                        <label for="amount">Сумма</label>
                        <input type="number" id="amount" placeholder="Введите сумму" value="1" min="0" step="0.01">
                    </div>
                    
                    <div class="currency-selectors">
                        <div class="form-group">
                            <label for="from-currency">Из</label>
                            <select id="from-currency"></select>
                        </div>
                        
                        <button id="swap-btn" class="swap-btn">
                            <i class="fas fa-exchange-alt"></i>
                        </button>
                        
                        <div class="form-group">
                            <label for="to-currency">В</label>
                            <select id="to-currency"></select>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <button id="convert-btn" class="btn btn-primary">Конвертировать</button>
                        <button id="reset-btn" class="btn btn-secondary">Сбросить</button>
                    </div>
                </div>
                
                <div class="result-container">
                    <div id="result" class="result">
                        <p>1.00 USD = <span id="conversion-rate">0.00</span> EUR</p>
                        <h3><span id="converted-amount">0.00</span> <span id="to-currency-code">EUR</span></h3>
                    </div>
                    <div id="last-updated" class="last-updated">
                        <small>Последнее обновление: <span id="update-time">--</span></small>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2025 ExchangeCalc</p>
            <ul class="footer-links">
                <li><a href="about.html">О нас</a></li>
                <li><a href="contact.html">Контакты</a></li>
            </ul>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
